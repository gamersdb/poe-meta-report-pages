title: PoE Meta Report
description: Path of Exile 1 のリーグ別ビルドメタレポート
url: https://gamersdb.github.io
baseurl: /poe-meta-report-pages
author: gamersdb
lang: ja
timezone: Asia/Tokyo
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
kramdown:
  input: GFM
collections:
  reports:
    output: true
defaults:
  - scope:
      path: ""
      type: reports
    values:
      layout: report
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - script
