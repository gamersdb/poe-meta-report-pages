    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span>{{ site.title }}</span>
      </a>
      <nav aria-label="メインナビゲーション">
        <a href="{{ '/' | relative_url }}">最新</a>
        <a href="{{ '/reports/' | relative_url }}">レポート一覧</a>
        <a href="{{ '/about/' | relative_url }}">このサイトについて</a>
      </nav>
    </header>
    <main class="site-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>Path of Exile 1 build data sourced from poe.ninja.</p>
      <p><a href="https://github.com/gamersdb/poe-meta-report2">集計・生成コード</a></p>
